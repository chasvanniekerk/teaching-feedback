(async()=>{if(!key)throw 0;let res=await fetch(B+'rpc/dashboard_results',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_key:key})});rows=await res.json();if(!rows.length)throw 0;let meta=rows[0];rows=rows.filter(r=>r.id!==null);expiry.textContent='Resultaten beschikbaar tot '+new Date(meta.expires_at).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})+'. Daarna worden ze verwijderd.';G.forEach(g=>avgs[g]=avg(rows.filter(r=>r.respondent_group===g)));let students=avg(rows.filter(r=>SG.includes(r.respondent_group)));counts.innerHTML=G.map(g=>'<span class="pill"><b>'+({'Self-assessment':'Zelfbeoordeling','Student – Year 1':'Student – Jaar 1','Student – Year 2':'Student – Jaar 2','Student – Year 3':'Student – Jaar 3','Student – Year 4':'Student – Jaar 4','Colleague':'Collega','Manager':'Leidinggevende'}[g]||g)+'</b>: n='+(avgs[g]?.response_count||0)+'</span>').join('');radar('a',[{n:'Zelf',r:avgs['Self-assessment']},{n:'Alle studenten',r:students},{n:'Collega’s',r:avgs.Colleague},{n:'Manager',r:avgs.Manager}]);radar('b',SG.map(g=>({n:g.replace('Student – Year ','Jaar '),r:avgs[g]})));let cols=G.filter(g=>avgs[g]),h='<table><tr><th>Principe</th>'+cols.map(g=>'<th>'+({'Self-assessment':'Zelfbeoordeling','Student – Year 1':'Student – Jaar 1','Student – Year 2':'Student – Jaar 2','Student – Year 3':'Student – Jaar 3','Student – Year 4':'Student – Jaar 4','Colleague':'Collega','Manager':'Leidinggevende'}[g]||g)+' (n='+avgs[g].response_count+')</th>').join('')+(students?'<th>Alle studenten</th>':'')+'</tr>';L.forEach((l,i)=>h+='<tr><td>'+l+'</td>'+cols.map(g=>'<td>'+avgs[g][ks[i]].toFixed(2)+'</td>').join('')+(students?'<td>'+students[ks[i]].toFixed(2)+'</td>':'')+'</tr>');table.innerHTML=h+'</table>'})().catch(()=>document.body.innerHTML='<main class="w"><div class="c"><h1>Dashboard niet beschikbaar</h1><p>Deze privékoppeling is ongeldig of de Teacher360 is verlopen.</p></div></main>');

function csv(){let head=['response','respondent_group','created_at',...ks,'raw_answers'],lines=[head.join(',')];rows.forEach((r,i)=>{let vals=[i+1,r.respondent_group,r.created_at,...ks.map(k=>r[k]),JSON.stringify(r.raw_answers||{})].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"');lines.push(vals.join(','))});let blob=new Blob([lines.join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Teacher360-raw-data.csv';a.click();URL.revokeObjectURL(a.href)}
